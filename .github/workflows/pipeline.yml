name: Pipeline

on:
  workflow_dispatch:

jobs:
  Pipeline:
    name: Setup Pipeline
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: /Users/jonathankee/Data-Science-Projects
    steps:
      - name: Print working directory
        run: |
          pwd

      - name: Set current date
        run: echo "TODAY=$(date +'%d%m%Y')" >> $GITHUB_ENV

      - name: Use the date
        run: echo "Today's date is $TODAY"
      
      # ------------------------------------- Smeltor -------------------------------------
      - name: Exchange ticker AL.AI1
        run: tsc && node ./build/ingestion/json/cxpc.js "https://rest.fnar.net/exchange/cxpc/AL.AI1"

      - name: Run SQL Exchange ticker AL.AI1
        run: docker exec -i -e PGPASSWORD=abc123 postgres-container psql --dbname=prosperous_universe --username=postgres < ingestion/sql/cxpc_AL_AI1_${TODAY}.sql

      - name: Exchange ticker AU.AI1
