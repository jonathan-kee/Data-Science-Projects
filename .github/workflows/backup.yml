name: Backup Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Pipeline:
    name: Setup Pipeline
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: /Users/jonathankee/Data-Science-Projects
    steps:
      - name: Set current date
        run: echo "TODAY=$(date +'%d%m%Y')" >> $GITHUB_ENV

      - name: Create backup directory if missing
        run: mkdir -p ./backup_sql

      - name: backup
        run: docker exec -t postgres-container pg_dump -U postgres -d prosperous_universe > ./backup_sql/backup_${TODAY}.sql

      # Copies local vendor action into the runner's internal workspace folder
      - name: Populate runner workspace with local action
        run: |
          mkdir -p $GITHUB_WORKSPACE/.github/actions
          cp -r /Users/jonathankee/Data-Science-Projects/.github/actions/upload-artifact $GITHUB_WORKSPACE/.github/actions/

      - name: Upload backup to GitHub Artifacts
        uses: ./.github/actions/upload-artifact
        with:
          name: db-backup-${{ env.TODAY }}
          path: /Users/jonathankee/Data-Science-Projects/backup_sql/backup_${{ env.TODAY }}.sql
          retention-days: 30