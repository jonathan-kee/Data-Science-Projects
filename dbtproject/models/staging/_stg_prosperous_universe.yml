models:
  - name: sme_recipe_table_input_aggregate
    description: Calculate the buying price of SME (Smeltor) required for report

  - name: sme_recipe_table_output_aggregate
    description: Calculate the selling price of SME (Smeltor) required for report

  - name: sme_recipe_report
    description: Calculate revenue a day, profit per day (minus smeltor recipe cost only) 

  - name: prices_from_recipe_report
    description: This is to ovewrite exisitng pricing data from SME (Smeltor) output

  - name: revenue_per_day_report
    description: Calculate the revenue per day from sme_recipe_report

  - name: revenue_before_exchange_report
    description: Calculate the total revenue from sme_recipe_report and inventory before going to exchange

  - name: profit_per_day_report
    description: Calculate profit by total revenue minus workforce cost and smelter cost

  - name: budget_exchange_report
    description: Shows how long to sustain base on day of exchange. 

  - name: budge_future_exchange_report
    description: Shows how long to sustain base on future day of exchange.

  - name: stg_cxpc_al_ai1
    description: Contains chart data for ticker al_ai1

  - name: stg_cxpc_alo_ai1
    description: Contains chart data for ticker alo_ai1

  - name: stg_inventory
    description: Contains all tickers for personal inventory

  - name: stg_prices
    description: Contains prices for all the exchanges for a particular Ticker
    columns: 
      - name: '"Ticker"'
        description: The primary key for this table
        data_tests:
          - unique
          - not_null

  - name: stg_recipe_inputs_time
    description: Contains recipe material input, material output, time taken per order

  - name: stg_recipe_inputs
    description: Contains recipe material input, material output (no time taken per order) 