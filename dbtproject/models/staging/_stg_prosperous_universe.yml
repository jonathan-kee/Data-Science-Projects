models:
  - name: recipe_table_output_aggregate
    description: Calculate the selling price of SME (Smeltor)

  - name: prices_from_recipe_report
    description: This is to ovewrite exisitng pricing data from SME (Smeltor) output

  - name: stg_cxpc_al_ai1
    description: Contains chart data for ticker al_ai1

  - name: stg_cxpc_alo_ai1
    description: Contains chart data for ticker alo_ai1

  - name: stg_inventory
    description: Contains all tickers for personal inventory

  - name: stg_prices
    description: Contains prices for all the exchanges for a particular Ticker
    columns: 
      - name: '"Ticker"'
        description: The primary key for this table
        data_tests:
          - unique
          - not_null

  - name: stg_recipe_inputs_time
    description: Contains recipe material input, material output, time taken per order

  - name: stg_recipe_inputs
    description: Contains recipe material input, material output (no time taken per order) 