version: 2

models:
  - name: dim_ticker
    description: "Dimension table for financial tickers/symbols."
    columns:
      - name: ticker_id
        tests:
          - unique
          - not_null
      - name: ticker
        tests:
          - not_null

  - name: dim_date_time
    description: "Dimension table capturing quote timestamps and load times."
    columns:
      - name: date_time_id
        tests:
          - unique
          - not_null

  - name: fact_ticker_quotes
    description: "Fact table storing unpivoted quotes, asks, bids, and averages across providers."
    columns:
      - name: ticker_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_ticker')
              field: ticker_id
      - name: date_time_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date_time')
              field: date_time_id
      - name: provider_code
        tests:
          - not_null